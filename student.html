<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Học viên - Quiz </title>
<link rel="stylesheet" href="css/style.css"/>

<!-- MathJax: hiển thị công thức LaTeX trong câu hỏi và đáp án -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']]
  },
  svg: {
    fontCache: 'global'
  }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>

<body>
<div class="header">
  <div class="logo">Quiz<span> Kiến thức </span></div>
  <div class="nav">
    <a class="nav-btn active" href="student.html">🎓 Học viên</a>
    <a class="nav-btn" href="teacher.html">👩‍🏫 Quản trị viên</a>
  </div>
</div>

<div class="main">
  <div class="screen active" id="sc-home">
    <div class="card" style="max-width:460px;margin:30px auto">
      <div style="text-align:center;margin-bottom:24px">
        <div style="font-size:48px;margin-bottom:10px">📝</div>
        <div style="font-size:22px;font-weight:700">Cổng Thi Trắc Nghiệm</div>
        <div style="font-size:14px;color:#6b7280;margin-top:4px">Khoa Khoa học cơ bản</div>
      </div>

      <div class="fg">
          <label>Mã học viên *</label>
          <input type="text" id="s-id" placeholder="VD: HV01">
      </div>
      
      <div class="fg">
          <label>Họ và Tên *</label>
          <input type="text" id="s-name" placeholder="VD: Nguyễn Văn A">
      </div>
      
      <!-- THÊM KHỐI CHỌN CA THI VÀO ĐÂY -->
      <div class="fg">
          <label>Chọn ca thi / lớp học *</label>
          <select id="s-cohort" style="width: 100%; padding: 10px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 14px;">
              <option value="" disabled selected>-- Đang tải danh sách ca thi... --</option>
          </select>
      </div>

      <!-- Ô NHẬP MÃ TRUY CẬP CA THI -->
      <div class="fg">
          <label>MÃ TRUY CẬP CA THI *</label>
          <input type="text" id="s-cohort-code" placeholder="Nhập mã do giáo viên cung cấp (VD: K6A2B)..." style="text-transform: uppercase;">
      </div>
      
      <div class="fg">
        <label>Chọn đề thi *</label>
        <select id="s-exam" style="width: 100%; padding: 10px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 14px; background-color: #f8fafc;">
            <option value="" disabled selected>-- Nhập đúng mã ca thi để tải đề --</option>
        </select>
      </div>

      <div id="s-exam-desc" style="font-size:12px;color:#6b7280;margin-bottom:13px;min-height:18px"></div>

      <button class="btn btn-p btn-full" id="btn-start">Bắt đầu làm bài →</button>
    </div>
  </div>

  <div class="screen" id="sc-quiz">
    <div style="font-size:14px;color:#374151;font-weight:700;margin-bottom:6px" id="q-student"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div style="font-size:16px;color:#3b82f6;font-weight:800; text-transform: uppercase;" id="q-progress">Part 1</div>
      <div class="timer-badge" id="q-timer">⏱ 00:00</div>
    </div>

    <div class="pbar" style="margin-bottom: 25px;">
      <div class="pfill" id="q-pbar" style="width:10%"></div>
    </div>

    <!-- KHUNG CHỨA TOÀN BỘ CÂU HỎI TRONG 1 PART -->
    <div id="part-container"></div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:30px; padding-top:20px; border-top:2px solid #e2e8f0;">
      <div>
        <button class="btn" id="btn-prev" style="display:none; margin-right: 8px; background: #f1f5f9; color: #334155; font-weight:600;">⬅ Phần trước</button>
      </div>
      <div>
        <button class="btn btn-p" id="btn-next" style="display:none; font-weight:600;">Tiếp tục (Phần sau) →</button>
        <button class="btn btn-p" id="btn-finish" style="display:none; background:#10b981; font-weight:600;">✅ Nộp bài</button>
      </div>
    </div>
  </div>

  <div class="screen" id="sc-result">
    <div class="card">
      <div class="score-circle" id="r-circle">
        <div class="score-num" id="r-score">0</div>
        <div class="score-lbl">điểm/10</div>
      </div>

      <div style="text-align:center;font-size:20px;font-weight:700;margin-bottom:4px" id="r-name"></div>
      <div style="text-align:center;font-size:14px;color:#6b7280;margin-bottom:20px" id="r-msg"></div>

      <div class="stats">
        <div class="stat">
          <div class="stat-n" id="r-cor" style="color:#1D9E75">0</div>
          <div class="stat-l">Câu đúng</div>
        </div>
        <div class="stat">
          <div class="stat-n" id="r-wrg" style="color:#ef4444">0</div>
          <div class="stat-l">Câu sai</div>
        </div>
        <div class="stat">
          <div class="stat-n" id="r-time">0s</div>
          <div class="stat-l">Thời gian</div>
        </div>
        <div class="stat">
          <div class="stat-n" id="r-pct">0%</div>
          <div class="stat-l">Tỷ lệ đúng</div>
        </div>
      </div>

      <details>
        <summary>Xem lại đáp án chi tiết</summary>
        <div id="r-review" style="margin-top:10px"></div>
      </details>

      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn" style="flex:1" id="btn-home">← Về trang chủ</button>
        <button class="btn btn-p" style="flex:1" id="btn-retake">🔄 Thi lại đề này</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/student.js"></script>
</body>
</html>
