<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Thi Trắc Nghiệm</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #1a202c; }
* { box-sizing: border-box; margin: 0; padding: 0; }
.q-screen { display: none; } .q-screen.active { display: block; }
.q-card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); border: 1px solid #e9edf2; margin-bottom: 16px; max-width: 600px; margin-left: auto; margin-right: auto; }
.q-btn { padding: 9px 18px; border-radius: 9px; border: 1px solid #d1d5db; background: #fff; color: #374151; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.q-btn:hover { background: #f9fafb; } .q-btn-p { background: #1D9E75; color: #fff; border-color: #1D9E75; } .q-btn-p:hover { background: #0F6E56; }
.q-fg { margin-bottom: 12px; } .q-fg label { display: block; font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
.q-fg input, .q-fg select { width: 100%; padding: 8px 12px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 13px; outline: none; }
.q-fg input:focus, .q-fg select:focus { border-color: #1D9E75; }
.q-pbar { height: 6px; background: #e5e7eb; border-radius: 3px; margin: 8px 0 16px; max-width: 600px; margin-left: auto; margin-right: auto; }
.q-pfill { height: 100%; background: #1D9E75; border-radius: 3px; transition: width 0.4s; }
.q-opt { width: 100%; text-align: left; padding: 10px 14px; border: 1.5px solid #e5e7eb; border-radius: 9px; margin-bottom: 8px; background: #fff; font-size: 14px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 10px; }
.q-opt:hover:not(:disabled) { border-color: #1D9E75; background: #f0fdf8; }
.q-opt.correct { border-color: #1D9E75; background: #f0fdf8; } .q-opt.wrong { border-color: #ef4444; background: #fef2f2; }
.q-opt:disabled { cursor: default; }
.q-okey { width: 26px; height: 26px; border-radius: 50%; background: #f3f4f6; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; border: 1.5px solid #e5e7eb; color: #6b7280; }
.q-opt.correct .q-okey { background: #1D9E75; color: #fff; border-color: #1D9E75; } .q-opt.wrong .q-okey { background: #ef4444; color: #fff; border-color: #ef4444; }
.q-fb { margin-top: 12px; padding: 10px 14px; border-radius: 9px; font-size: 13px; font-weight: 500; }
.q-fb-ok { background: #f0fdf8; color: #0F6E56; border: 1px solid #bbf7d0; } .q-fb-bad { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
.q-scircle { width: 120px; height: 120px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 16px; border: 4px solid #1D9E75; background: #f0fdf8; }
.q-snum { font-size: 32px; font-weight: 700; color: #0F6E56; } .q-slbl { font-size: 11px; color: #0F6E56; font-weight: 500; }
.q-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.q-stat { background: #f8fafc; padding: 12px; border-radius: 9px; text-align: center; border: 1px solid #e9edf2; }
.q-stat-n { font-size: 22px; font-weight: 700; margin-bottom: 2px; } .q-stat-l { font-size: 11px; color: #6b7280; }
.q-ri { padding: 10px 0; border-bottom: 1px solid #f1f5f9; } .q-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.q-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 5px; background: #e0f2fe; color: #0369a1; font-weight: 600; margin-bottom: 6px; }
.q-timer { background: #f0fdf8; color: #0F6E56; border: 1px solid #bbf7d0; padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }
summary { cursor: pointer; font-size: 14px; font-weight: 600; padding: 8px 0; color: #374151; outline: none; }
.header-bar { max-width: 600px; margin: 0 auto 6px; display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<div id="quiz-app">
  <!-- MÀN HÌNH CHỌN ĐỀ -->
  <div class="q-screen active" id="qs-home">
    <div class="q-card">
      <div style="text-align:center;margin-bottom:20px"><div style="font-size:40px;margin-bottom:8px">📝</div>
        <div style="font-size:18px;font-weight:700">Cổng Thi Trắc Nghiệm</div>
        <div style="font-size:13px;color:#6b7280;margin-top:3px">Tin học văn phòng</div>
      </div>
      <div class="q-fg"><label>Họ và tên *</label><input type="text" id="q-sname" placeholder="Nguyễn Văn A"/></div>
      <div class="q-fg"><label>Mã học viên / MSSV</label><input type="text" id="q-sid" placeholder="HV001"/></div>
      <div class="q-fg"><label>Chọn đề thi *</label><select id="q-esel" onchange="qUpdateDesc()"></select></div>
      <div id="q-edesc" style="font-size:13px;color:#6b7280;margin-bottom:12px;min-height:16px;text-align:center;"></div>
      <button class="q-btn q-btn-p" style="width:100%;padding:12px;font-size:15px;margin-top:10px" onclick="qStartExam()">Bắt đầu làm bài →</button>
    </div>
  </div>

  <!-- MÀN HÌNH LÀM BÀI -->
  <div class="q-screen" id="qs-quiz">
    <div class="header-bar">
      <div style="font-size:14px;color:#6b7280;font-weight:600" id="q-ptxt">Câu 1/10</div>
      <div class="q-timer" id="q-timer">⏱ 00:00</div>
    </div>
    <div class="q-pbar"><div class="q-pfill" id="q-pfill" style="width:10%"></div></div>
    <div class="q-card">
      <div class="q-badge" id="q-cat">Word</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:20px;line-height:1.6" id="q-qtext">Câu hỏi hiển thị ở đây</div>
      <div id="q-opts"></div>
      <div id="q-fb" style="display:none"></div>
    </div>
    <div class="header-bar" style="margin-top:12px">
      <div style="font-size:14px;color:#6b7280;font-weight:500" id="q-live">Đúng: 0/0</div>
      <div>
        <button class="q-btn q-btn-p" id="q-bnext" onclick="qNext()" style="display:none">Tiếp theo →</button>
        <button class="q-btn q-btn-p" id="q-bfinish" onclick="qFinish()" style="display:none">✅ Nộp bài</button>
      </div>
    </div>
  </div>

  <!-- MÀN HÌNH KẾT QUẢ -->
  <div class="q-screen" id="qs-result">
    <div class="q-card">
      <div class="q-scircle" id="q-rcircle"><div class="q-snum" id="q-rscore">0</div><div class="q-slbl">điểm/10</div></div>
      <div style="text-align:center;font-size:20px;font-weight:700;margin-bottom:4px" id="q-rname"></div>
      <div style="text-align:center;font-size:14px;color:#6b7280;margin-bottom:20px" id="q-rmsg"></div>
      <div class="q-stats">
        <div class="q-stat"><div class="q-stat-n" id="q-rcor" style="color:#1D9E75">0</div><div class="q-stat-l">Câu đúng</div></div>
        <div class="q-stat"><div class="q-stat-n" id="q-rwrg" style="color:#ef4444">0</div><div class="q-stat-l">Câu sai</div></div>
        <div class="q-stat"><div class="q-stat-n" id="q-rtime">0s</div><div class="q-stat-l">Thời gian</div></div>
        <div class="q-stat"><div class="q-stat-n" id="q-rpct">0%</div><div class="q-stat-l">Tỷ lệ đúng</div></div>
      </div>
      <details style="background:#f8fafc;padding:10px;border-radius:10px;margin-top:20px;border:1px solid #e9edf2;">
        <summary>Xem lại đáp án chi tiết</summary>
        <div id="q-review" style="margin-top:10px;border-top:1px solid #e5e7eb;padding-top:10px;"></div>
      </details>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="q-btn" style="flex:1" onclick="qGoHome()">← Về trang chủ</button>
        <button class="q-btn q-btn-p" style="flex:1" onclick="qRetake()">🔄 Thi lại đề này</button>
      </div>
    </div>
  </div>
</div>

<script>
// Dữ liệu mẫu (Giáo viên có thể thay thế sau)
var qData = {
    "questions": [
        {"id": 1, "cat": "Word", "subcat": "Word/Phần 1 - Định dạng ký tự", "text": "Phím tắt nào dùng để in đậm văn bản trong Word?", "opts": ["Ctrl+I","Ctrl+B","Ctrl+U","Ctrl+D"], "ans": 1},
        {"id": 2, "cat": "Word", "subcat": "Word/Phần 2 - Định dạng đoạn văn", "text": "Phím tắt Ctrl+E dùng để căn chỉnh đoạn văn theo kiểu nào?", "opts": ["Căn trái","Căn giữa","Căn phải","Căn đều 2 bên"], "ans": 1},
        {"id": 3, "cat": "Excel", "subcat": "Excel/Phần 2 - Hàm tính toán cơ bản", "text": "Hàm nào dùng để tính tổng trong Excel?", "opts": ["=COUNT()","=AVERAGE()","=SUM()","=MAX()"], "ans": 2},
        {"id": 4, "cat": "PowerPoint", "subcat": "PowerPoint/Phần 1 - Tạo & quản lý slide", "text": "Để thêm slide mới trong PowerPoint, dùng phím tắt nào?", "opts": ["Ctrl+N","Ctrl+M","Ctrl+T","Ctrl+S"], "ans": 1}
    ],
    "exams": [
        {"id": 1, "name": "Đề kiểm tra Word cơ bản", "desc": "Kiểm tra kiến thức MS Word", "count": 2, "cat": "Word", "subcat": "", "timeLimit": 5},
        {"id": 2, "name": "Đề kiểm tra Tin học tổng hợp", "desc": "Gồm Word, Excel, PowerPoint", "count": 4, "cat": "", "subcat": "", "timeLimit": 10}
    ]
};

var qState = {exam: null, student: {}, qs: [], idx: 0, answers: [], startTime: 0, timer: null};

function _qGet(id) { return document.getElementById(id); }
function _qQueryAll(sel) { return document.querySelectorAll(sel); }

function qShowScreen(s) {
  ['home','quiz','result'].forEach(function(x){
    var el = _qGet('qs-'+x);
    if(el) {
      if(x===s) el.classList.add('active');
      else el.classList.remove('active');
    }
  });
}

function qUpdateDesc() {
  var sel = _qGet('q-esel');
  if(!sel || !sel.value) return;
  var eid = parseInt(sel.value);
  var e = qData.exams.find(function(x){return x.id===eid});
  if(e) {
    var pool = (e.cat ? qData.questions.filter(function(q){return q.cat===e.cat}) : qData.questions).length;
    var descEl = _qGet('q-edesc');
    if(descEl) descEl.innerHTML = `<strong>${e.desc}</strong><br/>${e.count} câu • ${e.timeLimit > 0 ? '⏱ ' + e.timeLimit + ' phút' : 'Không giới hạn thời gian'}`;
  }
}

function qPopExamSelect() {
  var sel = _qGet('q-esel');
  if(!sel) return;
  if(qData.exams && qData.exams.length > 0){
      sel.innerHTML = qData.exams.map(function(e){ return '<option value="'+e.id+'">'+e.name+'</option>'; }).join('');
      qUpdateDesc();
  } else {
      sel.innerHTML = '<option value="">(Chưa có đề thi nào)</option>';
      _qGet('q-edesc').textContent = 'Vui lòng liên hệ giảng viên để thêm đề thi.';
  }
}

function qShuffle(arr) { return arr.slice().sort(function(){return Math.random()-0.5}); }

function qStartExam() {
  var name = _qGet('q-sname').value.trim();
  if(!name){alert('Vui lòng nhập họ tên để bắt đầu!');return;}
  var sel = _qGet('q-esel');
  if(!sel || !sel.value) {alert('Vui lòng chọn đề thi!');return;}
  
  var eid = parseInt(sel.value);
  var exam = qData.exams.find(function(e){return e.id===eid});
  
  var pool = qData.questions;
  if(exam.subcat) pool = pool.filter(function(q){return q.subcat===exam.subcat});
  else if(exam.cat) pool = pool.filter(function(q){return q.cat===exam.cat});
  
  var qs = qShuffle(pool).slice(0, Math.min(exam.count, pool.length));
  if(qs.length===0){alert('Đề thi này chưa có đủ câu hỏi trong ngân hàng!');return;}
  
  qState = {exam: exam, student: {name:name, id: _qGet('q-sid').value.trim()}, qs: qs, idx: 0, answers: [], startTime: Date.now(), timer: null};
  clearInterval(qState.timer);
  
  var tl = (exam.timeLimit||0)*60;
  qState.timer = setInterval(function(){
    var el = Math.floor((Date.now()-qState.startTime)/1000);
    if(tl>0){
      var rem = tl-el;
      if(rem<=0){qFinish();return;}
      var m=Math.floor(rem/60),s=rem%60;
      _qGet('q-timer').textContent='⏱ '+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    } else {
      var m=Math.floor(el/60),s=el%60;
      _qGet('q-timer').textContent='⏱ '+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    }
  }, 1000);
  
  qShowScreen('quiz');
  qRenderQ();
}

function qRenderQ() {
  var qs=qState.qs, q=qs[qState.idx], total=qs.length;
  _qGet('q-ptxt').textContent='Câu '+(qState.idx+1)+'/'+total;
  _qGet('q-pfill').style.width=((qState.idx+1)/total*100)+'%';
  _qGet('q-cat').textContent=q.subcat||q.cat||'Tổng hợp';
  _qGet('q-qtext').textContent=q.text;
  
  var cor = qState.answers.filter(function(a,i){return a===qs[i].ans}).length;
  _qGet('q-live').textContent='Đúng: '+cor+'/'+qState.idx;
  
  var keys=['A','B','C','D'];
  _qGet('q-opts').innerHTML=q.opts.map(function(o,i){
    return `<button class="q-opt" onclick="qSelect(${i})"><span class="q-okey">${keys[i]}</span>${o}</button>`;
  }).join('');
  
  _qGet('q-fb').style.display='none';
  _qGet('q-bnext').style.display='none';
  _qGet('q-bfinish').style.display='none';
}

function qSelect(idx) {
  var qs=qState.qs, q=qs[qState.idx];
  qState.answers[qState.idx]=idx;
  _qQueryAll('.q-opt').forEach(function(b){b.disabled=true});
  var btns=_qQueryAll('.q-opt');
  btns[idx].classList.add(idx===q.ans?'correct':'wrong');
  if(idx!==q.ans) btns[q.ans].classList.add('correct');
  
  var fb=_qGet('q-fb');
  fb.style.display='block';
  fb.className='q-fb '+(idx===q.ans?'q-fb-ok':'q-fb-bad');
  fb.innerHTML=idx===q.ans?'✅ Chính xác!':'❌ Sai rồi! Đáp án đúng: <strong>'+['A','B','C','D'][q.ans]+'. '+q.opts[q.ans]+'</strong>';
  
  var cor=qState.answers.filter(function(a,i){return a===qs[i].ans}).length;
  _qGet('q-live').textContent='Đúng: '+cor+'/'+(qState.idx+1);
  
  if(qState.idx+1<qs.length) _qGet('q-bnext').style.display='inline-block';
  else _qGet('q-bfinish').style.display='inline-block';
}

function qNext(){qState.idx++;qRenderQ();}

function qFinish() {
  clearInterval(qState.timer);
  var qs=qState.qs, cor=qState.answers.filter(function(a,i){return a===qs[i].ans}).length;
  var total=qs.length, pct=Math.round(cor/total*100);
  var score=Math.round(cor/total*10*10)/10;
  var elapsed=Math.round((Date.now()-qState.startTime)/1000);

  _qGet('q-rname').textContent=qState.student.name;
  _qGet('q-rscore').textContent=score;
  _qGet('q-rcor').textContent=cor;
  _qGet('q-rwrg').textContent=total-cor;
  var em=elapsed>=60?Math.floor(elapsed/60)+'p ':'';
  _qGet('q-rtime').textContent=em+(elapsed%60)+'s';
  _qGet('q-rpct').textContent=pct+'%';
  
  var c=_qGet('q-rcircle'),sn=_qGet('q-rscore');
  if(pct>=80){c.style.borderColor='#1D9E75';c.style.background='#f0fdf8';sn.style.color='#0F6E56';}
  else if(pct>=60){c.style.borderColor='#f59e0b';c.style.background='#fffbeb';sn.style.color='#b45309';}
  else{c.style.borderColor='#ef4444';c.style.background='#fef2f2';sn.style.color='#b91c1c';}
  
  _qGet('q-rmsg').textContent=pct>=80?'🎉 Xuất sắc!':pct>=60?'👍 Khá tốt!':'💪 Cần cố gắng thêm nhé!';
  
  var keys=['A','B','C','D'];
  _qGet('q-review').innerHTML=qs.map(function(q,i){
    var ua=qState.answers[i],ok=ua===q.ans;
    return `<div class="q-ri"><div style="display:flex;gap:8px;align-items:flex-start"><div class="q-dot" style="background:${ok?'#1D9E75':'#ef4444'}"></div><div>
      <div style="font-size:14px;font-weight:600;margin-bottom:4px;color:#1a202c">${q.text}</div>
      <div style="font-size:13px;color:${ok?'#1D9E75':'#ef4444'}">Lựa chọn của bạn: ${keys[ua]}. ${q.opts[ua]}</div>
      ${ok?'':`<div style="font-size:13px;color:#1D9E75;margin-top:2px">✓ Đáp án đúng: ${keys[q.ans]}. ${q.opts[q.ans]}</div>`}
      </div></div></div>`;
  }).join('');
  
  qShowScreen('result');
}

function qGoHome(){clearInterval(qState.timer);qShowScreen('home');qPopExamSelect();}

function qRetake(){
  qState.idx=0;qState.answers=[];
  var pool=qData.questions;
  if(qState.exam.subcat) pool=pool.filter(function(q){return q.subcat===qState.exam.subcat});
  else if(qState.exam.cat) pool=pool.filter(function(q){return q.cat===qState.exam.cat});
  qState.qs=qShuffle(pool).slice(0,Math.min(qState.exam.count,pool.length));
  qState.startTime=Date.now();
  clearInterval(qState.timer);
  qState.timer=setInterval(function(){
    var el=Math.floor((Date.now()-qState.startTime)/1000),m=Math.floor(el/60),s=el%60;
    _qGet('q-timer').textContent='⏱ '+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  },1000);
  qShowScreen('quiz');
  qRenderQ();
}

// Chạy ngay khi load xong HTML
window.onload = function() {
    qPopExamSelect();
};
</script>
</body>
</html>
